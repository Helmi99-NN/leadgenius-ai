<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>LeadGenius AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f9f9f8;
      color: #191c1c;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #004c3d 0%, #076653 50%, #0a9f7f 100%);
      color: white;
      padding: 20px 16px 16px;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header-icon {
      width: 36px;
      height: 36px;
      background: rgba(255,255,255,0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }
    .header p {
      font-size: 11px;
      opacity: 0.8;
    }

    /* Platform Badge */
    .platform-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 8px 12px;
      backdrop-filter: blur(10px);
    }
    .platform-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .platform-name {
      font-size: 12px;
      font-weight: 600;
      flex: 1;
    }
    .platform-status {
      font-size: 10px;
      opacity: 0.8;
      padding: 2px 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 100px;
    }

    /* Capture Button */
    .capture-section {
      padding: 12px;
    }
    .capture-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      color: white;
      background: linear-gradient(135deg, #076653, #0a9f7f);
      box-shadow: 0 4px 12px rgba(7, 102, 83, 0.3);
    }
    .capture-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(7, 102, 83, 0.4);
    }
    .capture-btn:active {
      transform: translateY(0);
    }
    .capture-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .capture-btn.success {
      background: linear-gradient(135deg, #059669, #10b981);
    }

    /* Quick Actions */
    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 12px 12px;
    }
    .quick-btn {
      padding: 10px 8px;
      border: 1px solid #e1e3e2;
      border-radius: 8px;
      background: white;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: #191c1c;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .quick-btn:hover {
      border-color: #076653;
      color: #076653;
      background: #f0fdf4;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 0 12px 12px;
    }
    .stat-card {
      background: white;
      border: 1px solid #e1e3e2;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: #076653;
    }
    .stat-label {
      font-size: 9px;
      color: #6f7975;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    /* Log */
    .log-section {
      padding: 0 12px 12px;
    }
    .log-title {
      font-size: 11px;
      font-weight: 600;
      color: #6f7975;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .log-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: white;
      border: 1px solid #e1e3e2;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .log-platform {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      color: white;
    }
    .log-info { flex: 1; min-width: 0; }
    .log-name {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .log-meta {
      font-size: 10px;
      color: #6f7975;
    }
    .log-status {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .status-captured { background: #dcfce7; color: #166534; }
    .status-analyzed { background: #dbeafe; color: #1e40af; }

    .empty-state {
      text-align: center;
      padding: 16px;
      color: #6f7975;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Footer */
    .footer {
      padding: 10px 12px;
      border-top: 1px solid #e1e3e2;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer a {
      color: #076653;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
    }
    .footer a:hover { text-decoration: underline; }
    .footer .version {
      font-size: 10px;
      color: #6f7975;
    }

    /* Spinner */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div class="header-icon">🧠</div>
      <div>
        <h1>LeadGenius AI</h1>
        <p>Universal Chat Capture v2.0</p>
      </div>
    </div>
    <div class="platform-banner" id="platform-banner">
      <div class="platform-dot" id="platform-dot"></div>
      <span class="platform-name" id="platform-name">Mendeteksi platform...</span>
      <span class="platform-status" id="platform-status">—</span>
    </div>
  </div>

  <!-- Capture Button -->
  <div class="capture-section">
    <button class="capture-btn" id="capture-btn" disabled>
      <span id="capture-icon">📸</span>
      <span id="capture-text">Mendeteksi...</span>
    </button>
  </div>

  <!-- Quick Actions -->
  <div class="quick-actions">
    <button class="quick-btn" id="btn-dashboard">📊 Dashboard</button>
    <button class="quick-btn" id="btn-analyzer">🔍 Analyzer</button>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="stat-captures">0</div>
      <div class="stat-label">Capture</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-analyzed">0</div>
      <div class="stat-label">Dianalisis</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="stat-leads">0</div>
      <div class="stat-label">Lead Baru</div>
    </div>
  </div>

  <!-- Capture Log -->
  <div class="log-section">
    <div class="log-title">Riwayat Capture</div>
    <div id="log-list">
      <div class="empty-state">
        Belum ada capture.<br/>
        Buka chat di platform manapun lalu klik "Capture Chat".
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <a href="#" id="open-dashboard">📊 Buka Dashboard</a>
    <span class="version">v2.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
